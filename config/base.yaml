# BeaconAI base configuration.
# All tunable values live here, not in code.

seed: 42

data:
  # Develop on a fixed subsample of patients. Each split (train/validate/test) is
  # capped at this many rows. Set to null to use the full dataset.
  dev_sample: 50000
  paths:
    raw: data/raw
    interim: data/interim
    processed: data/processed

  # Official DDXPlus release (Mila, CC BY 4.0), hosted on Figshare.
  # Download links and checksums are read from the Figshare API at runtime.
  source:
    figshare_article_id: 20043374
    doi: 10.6084/m9.figshare.20043374
    files:
      - release_evidences.json
      - release_conditions.json
      - release_train_patients.zip
      - release_validate_patients.zip
      - release_test_patients.zip
    timeout_seconds: 60

  encoding:
    # Age bucket lower edges (years). Each bucket runs up to the next edge minus one;
    # the last bucket is open-ended.
    age_bins: [0, 1, 5, 15, 30, 45, 60, 75]
    # Age is also kept as one numeric column: age / age_scale, clipped to [0, 1].
    age_scale: 110
    # 0-10 scale evidences are one numeric column each: value / scale_max.
    scale_max: 10

eda:
  # Plots are drawn from this processed split.
  split: train
  output_dir: reports

mlflow:
  # Local SQLite backend (supports the model registry) and artifact store, both gitignored.
  tracking_db: mlruns/mlflow.db
  artifact_root: mlruns/artifacts
  experiment: beaconai-phase2
  registered_model: beaconai-classifier
  # Full-data runs move `champion`; dev-subsample runs move `dev`, so serving never picks up
  # a model trained on the subsample by accident.
  champion_alias: champion
  dev_alias: dev

train:
  models: [logreg, xgboost, mlp]
  # Picks the winner per model type and the registered champion. Validation split only.
  selection_metric: top3_accuracy
  # With all evidences known, several models reach top-3 = 1.0 on validation, so exact ties
  # are broken by these metrics, in order.
  tie_breakers: [top1_accuracy, macro_f1]
  # Single-patient predict_proba calls timed per model (median reported).
  latency_calls: 100

# Each model: `fixed` params are used as-is, `grid` params are searched (full product).
models:
  logreg:
    fixed: {max_iter: 500, solver: lbfgs, tol: 1.0e-4}
    grid:
      C: [0.1, 1.0, 10.0]
  xgboost:
    fixed:
      n_estimators: 400
      early_stopping_rounds: 20
      tree_method: hist
      subsample: 0.8
      colsample_bytree: 0.8
    grid:
      max_depth: [4, 6]
      learning_rate: [0.1, 0.3]
  mlp:
    fixed: {epochs: 30, batch_size: 512, patience: 3, weight_decay: 1.0e-5}
    grid:
      hidden_sizes: [[256], [512, 256]]
      dropout: [0.2, 0.4]
      lr: [1.0e-3]

eval:
  ks: [1, 3, 5]
  # k values for overlap between our top-k and the DDXPlus ground-truth differential.
  ddx_ks: [3, 5]
  output_dir: reports
  top_confusions: 15
  lowest_recall: 10

calibration:
  models: [xgboost, logreg]
  # none = raw probabilities, kept as a candidate so calibration has to earn its place.
  methods: [none, temperature, isotonic]
  # Validation is split per class: calibrators are fit on this share and every number is
  # reported on the rest, so no calibrator is scored on the rows it was fit to.
  fit_fraction: 0.5
  ece_bins: 15
  temperature_bounds: [0.05, 20.0]
  # A (model, method) pair can be champion only if its held-out top-3 accuracy meets both
  # floors. Isotonic calibration can change the ranking; temperature scaling cannot.
  # The champion is the eligible pair with the lowest partial-evidence ECE.
  top3_floor:
    full: 0.99
    # Provisional; set from the dev run (raw models) and documented in docs/phase3_calibration.md.
    partial: 0.0
  experiment: beaconai-phase3
  partial_evidence:
    # Each patient keeps the initial evidence plus this many other random evidences.
    extra_evidences: 3

abstention:
  # Abstain when the calibrated top-1 probability is below this (equal is answered).
  # Chosen from the partial-evidence coverage vs accuracy curve; see docs/phase3_calibration.md.
  threshold: 0.5
  # The run suggests the smallest threshold whose answered patients reach this top-k accuracy.
  target_accuracy: 0.95
  # k: how many conditions a differential shows.
  differential_size: 3
  # Thresholds evaluated for the coverage vs accuracy curve (evenly spaced from 0 to 1).
  curve_points: 101
