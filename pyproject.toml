[project]
name = "beaconai"
version = "0.1.0"
description = "AI clinical triage assistant (decision support, not diagnosis). Trained on synthetic data only."
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "scipy>=1.11",
]

[dependency-groups]
dev = [
    "dvc>=3.50",
    "pre-commit>=3.7",
    "pytest>=8.2",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beaconai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["legacy", "notebooks"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "RUF", # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["beaconai"]
